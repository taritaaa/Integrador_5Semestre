<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${repair.id() != null ? 'Editar Reparación #' + repair.id() : 'Nueva Reparación'})}"></head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/ui :: alerts}"></div>

<main class="app-main fade-in">

    <header class="page-header">
        <div>
            <h1 class="page-title" th:text="${repair.id() != null ? 'Editar Reparación #' + repair.id() : 'Registrar Nueva Reparación'}">
                Registrar Nueva Reparación
            </h1>
        </div>
        <div class="page-actions">
            <a th:href="@{/repairs}" class="btn btn-ghost">← Volver al Historial</a>
        </div>
    </header>

    <section class="form-shell fade-in-1">
        <form th:action="${repair.id() == null} ? @{/repairs} : @{/repairs/{id}(id=${repair.id()})}"
              method="post">
            <input th:if="${repair.id() != null}" type="hidden" name="_method" value="put">

            <div class="form-section-title">1. Datos Generales de la Orden</div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="date">Fecha de Orden *</label>
                    <input type="date" id="date" name="date"
                           th:value="${repair.date()}"
                           th:readonly="${repair.id() != null}"
                           class="mono" required>
                </div>

                <div class="form-group">
                    <label for="status">Estado *</label>
                    <select id="status" name="status" required>
                        <option th:each="s : ${statuses}"
                                th:value="${s.name()}"
                                th:text="${s.name() == 'IN_PROGRESS' ? 'En Proceso' : (s.name() == 'COMPLETED' ? 'Completada' : (s.name() == 'CANCELLED' ? 'Cancelada' : s.name()))}"
                                th:selected="${repair.status() == s}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="vehicleId">Vehículo *</label>
                    <!-- data-model es requerido por repairs.js para filtrar repuestos compatibles -->
                    <select id="vehicleId" name="vehicleId" th:disabled="${repair.id() != null}" required>
                        <option value="">Selecciona un vehículo...</option>
                        <option th:each="v : ${vehicles}"
                                th:value="${v.id()}"
                                th:text="${v.licensePlate() + ' — ' + v.modelBrand() + ' ' + v.modelName() + ' (' + v.ownerName() + ')'}"
                                th:selected="${repair.vehicleId() == v.id()}"
                                th:attr="data-model=${v.modelId()}"></option>
                    </select>
                    <input th:if="${repair.id() != null}" type="hidden" name="vehicleId" th:value="${repair.vehicleId()}">
                </div>

                <div class="form-group">
                    <label for="mechanicId">Mecánico Responsable *</label>
                    <select id="mechanicId" name="mechanicId" th:disabled="${repair.id() != null}" required>
                        <option value="">Selecciona un mecánico...</option>
                        <option th:each="m : ${mechanics}"
                                th:value="${m.id()}"
                                th:text="${m.name()}"
                                th:selected="${repair.mechanicId() == m.id()}"></option>
                    </select>
                    <input th:if="${repair.id() != null}" type="hidden" name="mechanicId" th:value="${repair.mechanicId()}">
                </div>

                <div class="form-group">
                    <label for="type">Tipo / Descripción del Trabajo *</label>
                    <input type="text" id="type" name="type"
                           th:value="${repair.type()}"
                           placeholder="Ej: Cambio de kit de embrague y sincronización"
                           required>
                </div>

                <div class="form-group">
                    <label for="laborCost">Costo Mano de Obra (COP) *</label>
                    <input type="number" id="laborCost" name="laborCost"
                           th:value="${repair.laborCost()}"
                           step="0.01" min="0"
                           class="mono" placeholder="180000" required>
                </div>
            </div>

            <!-- Constructor Dinámico de Repuestos (repairs.js) -->
            <div class="form-section-title">2. Repuestos Utilizados (Compatibles con el Modelo)</div>

            <div id="items" class="repair-items-stack">
                <!-- Filas precargadas si se está editando una orden con repuestos -->
                <div class="repair-item" th:each="item : ${repair.items()}">
                    <div class="form-group">
                        <label>Repuesto</label>
                        <select name="partIds" required>
                            <option value="">Selecciona repuesto compatible...</option>
                            <option th:each="p : ${parts}"
                                    th:value="${p.id()}"
                                    th:text="${p.name() + ' — $' + p.price() + ' (Stock: ' + p.stock() + ')'}"
                                    th:selected="${item.partId() == p.id()}"
                                    th:attr="data-model=${p.modelId()}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Cantidad</label>
                        <input type="number" name="quantities" th:value="${item.quantity()}" min="1" step="1" class="mono" required>
                    </div>
                    <button type="button" class="remove-item" title="Quitar repuesto" aria-label="Quitar repuesto">✕</button>
                </div>
            </div>

            <button type="button" id="addItem" class="btn btn-primary" style="min-height: 40px;">
                + Agregar Repuesto
            </button>

            <!-- Plantilla clonada por repairs.js -->
            <template id="itemTemplate">
                <div class="repair-item">
                    <div class="form-group">
                        <label>Repuesto</label>
                        <select name="partIds" required>
                            <option value="">Selecciona repuesto compatible...</option>
                            <option th:each="p : ${parts}"
                                    th:value="${p.id()}"
                                    th:text="${p.name() + ' — $' + p.price() + ' (Stock: ' + p.stock() + ')'}"
                                    th:attr="data-model=${p.modelId()}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Cantidad</label>
                        <input type="number" name="quantities" value="1" min="1" step="1" class="mono" required>
                    </div>
                    <button type="button" class="remove-item" title="Quitar repuesto" aria-label="Quitar repuesto">✕</button>
                </div>
            </template>

            <!-- Ubicación Geográfica Opcional (repair-location.js) -->
            <div class="form-section-title">3. Ubicación de Taller / Punto de Compra (Opcional)</div>

            <div class="form-grid" style="margin-bottom: 1rem;">
                <div class="form-group full-width">
                    <label for="workshopName">Nombre del Taller o Tienda de Repuestos</label>
                    <input type="text" id="workshopName" name="workshopName"
                           th:value="${repair.workshopName()}"
                           placeholder="Ej: Veloxa Sede Norte / Autopartes Tunja Centro">
                </div>
                <div class="form-group">
                    <label for="workshopLatitude">Latitud</label>
                    <input type="number" id="workshopLatitude" name="workshopLatitude"
                           th:value="${repair.workshopLatitude()}"
                           step="any" class="mono" placeholder="5.535280">
                </div>
                <div class="form-group">
                    <label for="workshopLongitude">Longitud</label>
                    <input type="number" id="workshopLongitude" name="workshopLongitude"
                           th:value="${repair.workshopLongitude()}"
                           step="any" class="mono" placeholder="-73.367780">
                </div>
            </div>

            <div class="map-toolbar">
                <span class="form-hint">Haz clic en el mapa o arrastra el marcador para fijar las coordenadas exactas.</span>
                <button type="button" id="currentLocation" class="btn btn-ghost" style="min-height: 38px;">
                    Usar mi Ubicación GPS
                </button>
            </div>

            <div class="neo-map-frame">
                <div id="repairLocationMap" class="neo-map-canvas"></div>
            </div>
            <p id="locationMessage" class="location-status-msg"></p>

            <div class="form-actions">
                <a th:href="@{/repairs}" class="btn btn-ghost">Cancelar</a>
                <button type="submit" class="btn btn-accent">
                    <span th:text="${repair.id() != null ? 'Guardar Cambios' : 'Registrar Reparación'}">Guardar</span>
                    <span>→</span>
                </button>
            </div>
        </form>
    </section>

</main>

<footer th:replace="~{fragments/ui :: footer}"></footer>
<script th:src="@{/js/repairs.js}" defer></script>
<script th:src="@{/js/repair-location.js}" defer></script>
</body>
</html>
