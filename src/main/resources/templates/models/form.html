
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modelo - Taller</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<h1 th:text="${vehicleModel.id() == null} ? 'Registrar modelo' : 'Editar modelo'">
    Registrar modelo
</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}"></p>

<form method="post"
      th:action="${vehicleModel.id() == null} ? @{/models} : @{/models/{id}(id=${vehicleModel.id()})}">

    <input type="hidden"
           name="_method"
           value="put"
           th:if="${vehicleModel.id() != null}">

    <!-- Nombre del modelo -->
    <label for="name">Nombre</label>
    <input type="text"
           id="name"
           name="name"
           maxlength="100"
           required
           th:value="${vehicleModel.name()}">

    <!-- Marca del modelo -->
    <label for="brand">Marca</label>
    <input type="text"
           id="brand"
           name="brand"
           maxlength="100"
           required
           th:value="${vehicleModel.brand()}">

    <!-- Tipo de vehículo -->
    <label for="vehicleType">Tipo de vehículo</label>
    <select id="vehicleType"
            name="vehicleType"
            required>

        <option value="">Seleccione</option>

        <option th:each="t : ${vehicleTypes}"
                th:value="${t}"
                th:text="${t.label()}"
                th:selected="${vehicleModel.vehicleType() == t}">
        </option>

    </select>

    <small>
        El tipo de vehículo determina el formato de placa.
        El tipo de servicio se selecciona al registrar el vehículo.
    </small>

    <div>
        <button type="submit">Guardar</button>
        <a th:href="@{/models}">Cancelar</a>
    </div>

</form>

</body>
</html>
