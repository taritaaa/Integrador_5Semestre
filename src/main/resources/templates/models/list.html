
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Modelos - Taller</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>

<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<h1>Modelos de vehículo</h1>

<!-- Mensajes -->
<p th:if="${successMessage}"
   th:text="${successMessage}"></p>

<p th:if="${errorMessage}"
   th:text="${errorMessage}"></p>

<!-- Registrar modelo: solo administrador -->
<a sec:authorize="hasRole('ADMIN')"
   th:href="@{/models/new}">
    Registrar modelo
</a>

<!-- Mensaje cuando no hay modelos -->
<p th:if="${#lists.isEmpty(models)}">
    No hay modelos registrados.
</p>

<!-- Listado de modelos -->
<table th:unless="${#lists.isEmpty(models)}">

    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Marca</th>
        <th>Tipo de vehículo</th>
        <th>Acciones</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="m : ${models}">

        <td th:text="${m.id()}"></td>

        <td th:text="${m.name()}"></td>

        <td th:text="${m.brand()}"></td>

        <td th:text="${m.vehicleTypeLabel()}"></td>

        <td>

            <!-- Consultar -->
            <a th:href="@{/models/{id}(id=${m.id()})}">
                Ver
            </a>

            <!-- Editar: solo administrador -->
            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/models/{id}/edit(id=${m.id()})}">
                Editar
            </a>

            <!-- Eliminar: solo administrador -->
            <form sec:authorize="hasRole('ADMIN')"
                  th:action="@{/models/{id}(id=${m.id()})}"
                  method="post">

                <input type="hidden"
                       name="_method"
                       value="delete">

                <button type="submit">
                    Eliminar
                </button>

            </form>

        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
