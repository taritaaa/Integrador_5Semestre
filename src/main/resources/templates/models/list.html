<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Catálogo de Modelos')}"></head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/ui :: alerts}"></div>

<main class="app-main fade-in">

    <header class="page-header">
        <div>
            <h1 class="page-title">Modelos de Vehículo</h1>
        </div>
        <div class="page-actions" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/models/new}" class="btn btn-accent">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span>Nuevo Modelo</span>
            </a>
        </div>
    </header>

    <div th:if="${#lists.isEmpty(models)}">
        <div th:replace="~{fragments/ui :: emptyState(
            'Sin modelos registrados',
            'Registra el primer modelo vehicular para asociar vehículos y compatibilidad de repuestos.',
            null, null
        )}"></div>
    </div>

    <section th:if="${!#lists.isEmpty(models)}" class="table-shell fade-in-1">
        <table class="neo-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Marca</th>
                <th>Modelo / Línea</th>
                <th>Tipo de Vehículo</th>
                <th>Formato de Placa</th>
                <th class="col-actions">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${models}">
                <td data-label="ID">
                        <span class="mono" style="color: var(--brand-cyan); font-weight: 700;"
                              th:text="'#' + ${m.id()}">#1</span>
                </td>
                <td data-label="Marca">
                    <strong th:text="${m.brand()}">Toyota</strong>
                </td>
                <td data-label="Modelo / Línea" th:text="${m.name()}">Corolla</td>
                <td data-label="Tipo">
                    <span class="neo-badge badge-info" th:text="${m.vehicleTypeLabel()}">Automóvil</span>
                </td>
                <td data-label="Formato Placa">
                        <span class="mono" style="font-size: 0.82rem; color: var(--text-secondary);"
                              th:text="${m.plateFormat()}">ABC-123</span>
                </td>
                <td data-label="Acciones" class="col-actions">
                    <div class="action-matrix">
                        <a th:href="@{/models/{id}(id=${m.id()})}"
                           class="action-btn-view"
                           data-tooltip="Ver detalle"
                           aria-label="Ver detalle">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </a>

                        <a sec:authorize="hasRole('ADMIN')"
                           th:href="@{/models/{id}/edit(id=${m.id()})}"
                           class="action-btn-edit"
                           data-tooltip="Editar registro"
                           aria-label="Editar registro">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </a>

                        <form sec:authorize="hasRole('ADMIN')"
                              th:action="@{/models/{id}(id=${m.id()})}"
                              method="post"
                              data-no-guard="true"
                              onsubmit="return confirm('¿Eliminar este modelo del catálogo? Solo se permite si no tiene vehículos o repuestos asociados.');">
                            <input type="hidden" name="_method" value="delete">
                            <button type="submit"
                                    class="action-btn-delete"
                                    data-tooltip="Eliminar registro"
                                    aria-label="Eliminar registro">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    <line x1="10" y1="11" x2="10" y2="17"></line>
                                    <line x1="14" y1="11" x2="14" y2="17"></line>
                                </svg>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

</main>

<footer th:replace="~{fragments/ui :: footer}"></footer>
</body>
</html>
