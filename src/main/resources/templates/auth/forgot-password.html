<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Recuperar contraseña')}"></head>
<body class="auth-body">
<!-- RF-29 y RF-30: Toast y modo claro/oscuro también en esta página pública -->
<div th:replace="~{fragments/ui :: ui}"></div>

<section class="auth-card">
    <div class="auth-header">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </span>
            <span class="brand-text">
                <strong>TallerPro</strong>
                <small>Recuperación de cuenta</small>
            </span>
        </div>
        <h1>Recuperar contraseña</h1>
        <p>Ingrese su correo y le enviaremos un enlace temporal para restablecer su contraseña.</p>
    </div>

    <p class="alert alert-info" th:if="${infoMessage}" th:text="${infoMessage}"></p>
    <p class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form method="post" th:action="@{/forgot-password}">
        <div class="form-group">
            <label for="email">Correo electrónico registrado</label>
            <input type="email" id="email" name="email" placeholder="nombre@taller.com" autocomplete="email" required autofocus>
        </div>

        <button type="submit" class="btn btn-lg btn-block">Enviar enlace de recuperación</button>
    </form>

    <div class="auth-footer auth-footer-center">
        <a th:href="@{/login}">&larr; Volver al inicio de sesión</a>
    </div>
</section>
</body>
</html>
