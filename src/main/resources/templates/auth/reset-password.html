<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña - Taller</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>
<body>
<h1>Restablecer contraseña</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}"></p>

<div th:if="${!tokenValid}">
    <p>El enlace no es válido o ya expiró.</p>
    <p><a th:href="@{/forgot-password}">Solicitar un enlace nuevo</a></p>
</div>

<form th:if="${tokenValid}" method="post" th:action="@{/reset-password}">
    <input type="hidden" name="token" th:value="${token}">

    <label for="newPassword">Nueva contraseña (entre 8 y 72 caracteres)</label>
    <input type="password" id="newPassword" name="newPassword" minlength="8" maxlength="72" required>

    <label for="confirmPassword">Confirmar contraseña</label>
    <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" maxlength="72" required>

    <button type="submit">Guardar contraseña</button>
</form>

<p><a th:href="@{/login}">Volver al inicio de sesión</a></p>
</body>
</html>
