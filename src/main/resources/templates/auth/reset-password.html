<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Restablecer contraseña')}"></head>
<body class="auth-body">
<!-- RF-29 y RF-30: Toast y modo claro/oscuro también en esta página pública -->
<div th:replace="~{fragments/ui :: ui}"></div>

<section class="auth-card">
    <div class="auth-header">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                </svg>
            </span>
            <span class="brand-text">
                <strong>TallerPro</strong>
                <small>Seguridad de acceso</small>
            </span>
        </div>
        <h1>Restablecer contraseña</h1>
        <p th:if="${tokenValid}">Define una nueva contraseña segura para reactivar tu acceso.</p>
    </div>

    <p class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <div th:if="${!tokenValid}">
        <div class="alert alert-warning">
            El enlace no es válido o ya expiró. Por seguridad, los enlaces de recuperación tienen tiempo limitado.
        </div>
        <a class="btn btn-lg btn-block" th:href="@{/forgot-password}">Solicitar un enlace nuevo</a>
    </div>

    <form th:if="${tokenValid}" method="post" th:action="@{/reset-password}">
        <input type="hidden" name="token" th:value="${token}">

        <div class="form-group">
            <label for="newPassword">Nueva contraseña (entre 8 y 72 caracteres)</label>
            <input type="password" id="newPassword" name="newPassword" minlength="8" maxlength="72" autocomplete="new-password" required autofocus>
            <div id="pw-strength" aria-live="polite"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña</label>
            <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" maxlength="72" autocomplete="new-password" required>
            <div id="pw-match-hint" class="pw-match-hint" aria-live="polite"></div>
        </div>

        <button type="submit" class="btn btn-lg btn-block">Guardar contraseña</button>
    </form>

    <div class="auth-footer auth-footer-center">
        <a th:href="@{/login}">&larr; Volver al inicio de sesión</a>
    </div>
</section>

<script th:if="${tokenValid}" th:src="@{/js/password-strength.js}" defer></script>
</body>
</html>
