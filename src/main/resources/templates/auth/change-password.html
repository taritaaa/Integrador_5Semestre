<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cambiar contraseña')}"></head>
<body class="auth-body">
<div th:replace="~{fragments/ui :: ui}"></div>

<section class="auth-card">
    <div class="auth-header">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </span>
            <span class="brand-text">
                <strong>TallerPro</strong>
                <small>Actualización de seguridad</small>
            </span>
        </div>
        <h1>Cambiar contraseña</h1>
        <p>Por seguridad, debe cambiar su contraseña temporal antes de continuar.</p>
    </div>

    <p class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form method="post" th:action="@{/change-password}">
        <div class="form-group">
            <label for="currentPassword">Contraseña actual (la temporal)</label>
            <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required autofocus>
        </div>

        <div class="form-group">
            <label for="newPassword">Nueva contraseña</label>
            <input type="password" id="newPassword" name="newPassword" maxlength="72" autocomplete="new-password" required>
            <!-- Indicador de seguridad: lo llena password-strength.js -->
            <div id="pw-strength" aria-live="polite"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar nueva contraseña</label>
            <input type="password" id="confirmPassword" name="confirmPassword" maxlength="72" autocomplete="new-password" required>
            <div id="pw-match-hint" class="pw-match-hint" aria-live="polite"></div>
        </div>

        <button type="submit" class="btn btn-lg btn-block">Guardar contraseña</button>
    </form>

    <div class="auth-footer">
        <a th:href="@{/}">&larr; Volver al panel</a>
        <!-- RF-02: el usuario siempre puede cerrar sesión -->
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="btn btn-ghost btn-sm">Cerrar sesión</button>
        </form>
    </div>
</section>

<script th:src="@{/js/password-strength.js}" defer></script>
</body>
</html>
