<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Acceso Denegado')}"></head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="auth-centered-stage fade-in">
    <section class="auth-card auth-centered-card" style="text-align: center;">
        <div class="empty-state-icon"
             style="background: var(--status-danger-bg); border-color: rgba(244, 63, 94, 0.45); color: var(--status-danger); margin-bottom: 1.25rem;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
        </div>

        <span class="neo-badge badge-danger" style="margin-bottom: 0.9rem;">
            <span class="neo-badge-dot"></span>
            HTTP 403 // ACCESO RESTRINGIDO
        </span>

        <h1 class="auth-card-title" style="margin-bottom: 0.5rem;">Permisos Insuficientes</h1>
        <p class="auth-card-subtitle" style="margin-bottom: 1.85rem;">
            Tu rol actual no cuenta con autorización para acceder a este módulo de Veloxa Service.
        </p>

        <div style="display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap;">
            <a th:href="@{/}" class="btn btn-primary">Volver al Panel</a>
            <a href="javascript:history.back()" class="btn btn-ghost">Regresar</a>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/ui :: footer}"></footer>

</body>
</html>
