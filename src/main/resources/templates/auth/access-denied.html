<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Acceso denegado')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="page-shell">
    <section class="card status-card">
        <div class="status-icon" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
            </svg>
        </div>

        <span class="status-code">ERROR 403 &middot; ACCESO RESTRINGIDO</span>
        <h1>Acceso denegado</h1>
        <p>No tiene permiso para realizar esta acción con su rol actual. Si necesita autorización adicional, contacte al administrador del taller.</p>

        <div class="status-actions">
            <a class="btn" th:href="@{/}">Volver al inicio</a>
            <button type="button" class="btn btn-secondary" onclick="history.back()">Página anterior</button>
        </div>
    </section>
</main>
</body>
</html>
