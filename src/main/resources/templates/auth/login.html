<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - Taller</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>
<body>
<h1>Iniciar sesión</h1>

<p th:if="${param.error}">Correo o contraseña incorrectos, o la cuenta está desactivada.</p>
<p th:if="${param.logout}">Sesión cerrada correctamente.</p>
<p th:if="${successMessage}" th:text="${successMessage}"></p>

<form method="post" th:action="@{/login}">
    <label for="email">Correo</label>
    <input type="email" id="email" name="email" required autofocus>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required>

    <button type="submit">Ingresar</button>
</form>

<p><a th:href="@{/forgot-password}">¿Olvidó su contraseña?</a></p>
</body>
</html>
