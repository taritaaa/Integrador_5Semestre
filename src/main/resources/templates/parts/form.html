<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${part.id() != null ? 'Editar Repuesto' : 'Nuevo Repuesto'})}"></head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/ui :: alerts}"></div>

<main class="app-main fade-in">

    <nav class="breadcrumb-trail" aria-label="Ruta de navegación">
        <a th:href="@{/}">Panel</a>
        <span class="breadcrumb-sep">//</span>
        <a th:href="@{/parts}">Repuesto</a>
        <span class="breadcrumb-sep">//</span>
        <span th:text="${part.id() != null ? 'Editar #' + part.id() : 'Nuevo Repuesto'}">Formulario</span>
    </nav>

    <header class="page-header">
        <div>
            <h1 class="page-title" th:text="${part.id() != null ? 'Editar Repuesto' : 'Registrar Nuevo Repuesto'}">
                Registrar Nuevo Repuesto
            </h1>
        </div>
        <div class="page-actions">
            <a th:href="@{/parts}" class="btn btn-ghost">← Volver al Inventario</a>
        </div>
    </header>

    <section class="form-shell fade-in-1">
        <!-- Crear usa multipart/form-data (RF-16); Editar usa _method=put (RF-18) -->
        <form th:action="${part.id() == null} ? @{/parts} : @{/parts/{id}(id=${part.id()})}"
              th:attr="enctype=${part.id() == null ? 'multipart/form-data' : 'application/x-www-form-urlencoded'}"
              method="post">
            <input th:if="${part.id() != null}" type="hidden" name="_method" value="put">

            <div class="form-section-title">1. Identificación y Compatibilidad</div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Nombre del Repuesto *</label>
                    <input type="text" id="name" name="name"
                           th:value="${part.name()}"
                           placeholder="Ej: Pastillas de Freno Delanteras Cerámicas"
                           required autofocus>
                </div>

                <div class="form-group">
                    <label for="ean">Código EAN *</label>
                    <input type="text" id="ean" name="ean"
                           th:value="${part.ean()}"
                           class="mono"
                           placeholder="Ej: 7701234567890"
                           required>
                </div>

                <div class="form-group full-width">
                    <label for="modelId">Modelo de Vehículo Compatible *</label>
                    <select id="modelId" name="modelId" required>
                        <option value="">Selecciona un modelo...</option>
                        <option th:each="m : ${models}"
                                th:value="${m.id()}"
                                th:text="${m.brand() + ' ' + m.name() + ' (' + m.vehicleTypeLabel() + ')'}"
                                th:selected="${part.modelId() == m.id()}"></option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="description">Descripción Técnica</label>
                    <textarea id="description" name="description"
                              th:text="${part.description()}"
                              placeholder="Especificaciones del fabricante, referencias cruzadas o recomendaciones de instalación..."></textarea>
                </div>
            </div>

            <div class="form-section-title">2. Precio, Existencias e Imagen</div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="price">Precio Unitario (COP) *</label>
                    <input type="number" id="price" name="price"
                           th:value="${part.price()}"
                           step="0.01" min="0"
                           class="mono" placeholder="125000" required>
                </div>

                <div class="form-group">
                    <label for="stock">Stock Inicial / Actual *</label>
                    <input type="number" id="stock" name="stock"
                           th:value="${part.stock()}"
                           min="0" step="1"
                           class="mono" placeholder="10" required>
                </div>

                <!-- Campo de imagen al registrar (en edición se actualiza desde el detalle) -->
                <div class="form-group full-width" th:if="${part.id() == null}">
                    <label for="image">Fotografía de Referencia (Opcional)</label>
                    <input type="file" id="image" name="image" accept="image/png, image/jpeg, image/webp">
                    <span class="form-hint">Formatos permitidos: JPG, PNG o WEBP. También podrás cambiarla luego en el detalle del repuesto.</span>
                </div>
            </div>

            <div class="form-actions">
                <a th:href="@{/parts}" class="btn btn-ghost">Cancelar</a>
                <button type="submit" class="btn btn-accent">
                    <span th:text="${part.id() != null ? 'Guardar Cambios' : 'Registrar Repuesto'}">Guardar</span>
                    <span>→</span>
                </button>
            </div>
        </form>
    </section>

</main>

<footer th:replace="~{fragments/ui :: footer}"></footer>
</body>
</html>
