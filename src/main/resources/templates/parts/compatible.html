
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Repuestos compatibles - Taller</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>

<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<h1>Buscar repuestos compatibles</h1>

<p>
    Seleccione un modelo de vehículo para consultar
    los repuestos disponibles.
</p>

<!-- Formulario de búsqueda -->
<form method="get"
      th:action="@{/parts/compatible}">

    <label for="modelId">Modelo del vehículo</label>

    <select id="modelId"
            name="modelId"
            required>

        <option value="">Seleccione un modelo</option>

        <option th:each="m : ${models}"
                th:value="${m.id()}"
                th:text="${m.name() + ' - ' + m.brand()}"
                th:selected="${selectedModelId != null and selectedModelId == m.id()}">
        </option>

    </select>

    <button type="submit">Buscar</button>

</form>

<!-- Errores -->
<p th:if="${errorMessage}"
   th:text="${errorMessage}"></p>

<!-- Resultados -->
<div th:if="${searched}">

    <h2>Resultados de la búsqueda</h2>

    <p th:if="${#lists.isEmpty(parts)}">
        No hay repuestos registrados para este modelo.
    </p>

    <table th:unless="${#lists.isEmpty(parts)}">

        <thead>
        <tr>
            <th>Nombre</th>
            <th>Código de barras</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="p : ${parts}">

            <td th:text="${p.name()}"></td>

            <td th:text="${p.ean()}"></td>

            <td th:text="${'$ ' + #numbers.formatDecimal(p.price(), 1, 'POINT', 2, 'COMMA')}"></td>

            <td>
                <strong th:if="${p.stock() == 0}">
                    Agotado
                </strong>

                <span th:if="${p.stock() > 0}"
                      th:text="${p.stock()}"></span>
            </td>

            <td>
                <a th:href="@{/parts/{id}(id=${p.id()})}">
                    Ver detalle
                </a>
            </td>

        </tr>

        </tbody>

    </table>

</div>

<a th:href="@{/parts}">
    Volver a repuestos
</a>

</body>
</html>
