<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!-- ==================================================================
         0. FRAGMENTO RETROCOMPATIBLE: ~{'fragments/ui' :: ui}
         Garantiza compatibilidad inmediata con todas las vistas existentes
         ================================================================== -->
    <th:block th:fragment="ui">
        <meta name="theme-color" content="#050811">
        <link rel="icon" type="image/png" th:href="@{/images/brand/logo-veloxa.png}">

        <script>
            (function () {
                try {
                    var saved = localStorage.getItem('veloxa-theme') || localStorage.getItem('theme') || 'dark';
                    var theme = (saved === 'light') ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', theme);
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute('content', theme === 'light' ? '#f8fafc' : '#050811');
                } catch (e) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            })();
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
              integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
              crossorigin="">
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
                integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
                crossorigin="" defer></script>

        <link rel="stylesheet" th:href="@{/css/theme.css}">
        <script th:src="@{/js/ui.js}" defer></script>
    </th:block>
</head>
<body>

<!-- ======================================================================
     1. SISTEMA DE ALERTAS FLASH / TOASTS
     Uso: <div th:replace="~{fragments/ui :: alerts}"></div>
     ====================================================================== -->
<div th:fragment="alerts" id="toast-container" class="neo-toast-stack" aria-live="polite" aria-atomic="true">
    <div th:if="${successMessage}" class="neo-alert neo-alert-success" role="status" data-auto-dismiss="5000">
        <span class="neo-alert-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        </span>
        <div class="neo-alert-body">
            <div class="neo-alert-title">Operación Exitosa</div>
            <p th:text="${successMessage}"></p>
        </div>
        <button type="button" class="neo-alert-close" aria-label="Cerrar" onclick="this.closest('.neo-alert').remove()">✕</button>
    </div>

    <div th:if="${errorMessage}" class="neo-alert neo-alert-error" role="alert" data-auto-dismiss="7000">
        <span class="neo-alert-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </span>
        <div class="neo-alert-body">
            <div class="neo-alert-title">Alerta del Sistema</div>
            <p th:text="${errorMessage}"></p>
        </div>
        <button type="button" class="neo-alert-close" aria-label="Cerrar" onclick="this.closest('.neo-alert').remove()">✕</button>
    </div>

    <div th:if="${warningMessage}" class="neo-alert neo-alert-warning" role="alert" data-auto-dismiss="6000">
        <span class="neo-alert-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
        </span>
        <div class="neo-alert-body">
            <div class="neo-alert-title">Advertencia</div>
            <p th:text="${warningMessage}"></p>
        </div>
        <button type="button" class="neo-alert-close" aria-label="Cerrar" onclick="this.closest('.neo-alert').remove()">✕</button>
    </div>

    <div th:if="${infoMessage}" class="neo-alert neo-alert-info" role="status" data-auto-dismiss="5000">
        <span class="neo-alert-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
        </span>
        <div class="neo-alert-body">
            <div class="neo-alert-title">Información</div>
            <p th:text="${infoMessage}"></p>
        </div>
        <button type="button" class="neo-alert-close" aria-label="Cerrar" onclick="this.closest('.neo-alert').remove()">✕</button>
    </div>
</div>

<!-- ======================================================================
     2. MATRIZ DE BOTONES DE ACCIÓN CRUD (ICONOS SIN TEXTO + TOOLTIPS)
     ====================================================================== -->
<div th:fragment="crudActions(viewUrl, editUrl, deleteUrl, confirmMsg)" class="action-matrix">

    <!-- Ver Detalle -->
    <a th:if="${viewUrl != null}"
       th:href="${viewUrl}"
       class="action-btn-view"
       data-tooltip="Ver detalle"
       aria-label="Ver detalle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
    </a>

    <!-- Editar Registro -->
    <a th:if="${editUrl != null}"
       th:href="${editUrl}"
       class="action-btn-edit"
       data-tooltip="Editar registro"
       aria-label="Editar registro">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
    </a>

    <!-- Eliminar Registro (Compatible con @DeleteMapping("/{id}") + CSRF + data-no-guard) -->
    <form th:if="${deleteUrl != null}"
          th:action="${deleteUrl}"
          method="post"
          data-no-guard="true"
          th:attr="onsubmit=|return confirm('${confirmMsg != null ? confirmMsg : '¿Confirmas eliminar este registro? Esta acción no se puede deshacer.'}')|">
        <input type="hidden" name="_method" value="delete">
        <button type="submit"
                class="action-btn-delete"
                data-tooltip="Eliminar registro"
                aria-label="Eliminar registro">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        </button>
    </form>
</div>

<!-- ======================================================================
     3. ESTADO VACÍO REUTILIZABLE
     ====================================================================== -->
<div th:fragment="emptyState(title, description, ctaUrl, ctaLabel)" class="empty-state fade-in">
    <div class="empty-state-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"></rect>
            <line x1="9" y1="9" x2="15" y2="15"></line>
            <line x1="15" y1="9" x2="9" y2="15"></line>
        </svg>
    </div>
    <h3 th:text="${title}" style="margin-bottom: 0.4rem;">Sin resultados</h3>
    <p th:text="${description}" style="color: var(--text-secondary); margin-bottom: 1.35rem;">
        No hay registros disponibles en este momento.
    </p>
    <a th:if="${ctaUrl != null}" th:href="${ctaUrl}" class="btn btn-accent" th:text="${ctaLabel}">
        Crear registro
    </a>
</div>

<!-- ======================================================================
     4. FOOTER EDITORIAL VELOXA SERVICE
     ====================================================================== -->
<footer th:fragment="footer" class="veloxa-footer">
    <div class="veloxa-footer-inner">
        <div style="display: flex; align-items: center; gap: 0.65rem;">
            <img th:src="@{/images/brand/logo-veloxa.png}" alt="Veloxa" style="width: 24px; height: 24px; object-fit: contain;">
            <strong style="color: var(--text-primary); letter-spacing: 0.08em;">VELOXA SERVICE</strong>
            <span class="mono" style="color: var(--brand-cyan); font-size: 0.72rem;">// MJS</span>
        </div>
        <div class="mono" style="font-size: 0.73rem;">
            Sistema de Gestión de Taller Automotriz •
        </div>
    </div>
</footer>

</body>
</html>
