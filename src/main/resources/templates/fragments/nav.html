<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- Barra de navegación común. Se incluye en cada página con:
     <div th:replace="~{fragments/nav :: nav}"></div> -->
<header class="topbar" th:fragment="nav">
    <!-- RF-29 y RF-30: Toast y modo claro/oscuro en todas las páginas con menú -->
    <div th:replace="~{fragments/ui :: ui}"></div>

    <div class="topbar-inner">
        <!-- Marca del taller -->
        <a class="brand" th:href="@{/}" aria-label="Ir al inicio">
            <span class="brand-mark" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
            </span>
            <span class="brand-text">
                <strong>TallerPro</strong>
                <small>Gestión Automotriz</small>
            </span>
        </a>

        <!-- Botón menú móvil -->
        <button type="button" id="nav-toggle" class="icon-btn nav-toggle"
                aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="main-menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <!-- Enlaces principales (clase .menu usada por ui.js para aria-current="page") -->
        <nav id="main-menu" class="menu" aria-label="Navegación principal">
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/models}">Modelos</a>
            <a th:href="@{/vehicles}">Vehículos</a>
            <a th:href="@{/parts}">Repuestos</a>
            <a th:href="@{/repairs}">Reparaciones</a>
            <a th:href="@{/users}" sec:authorize="hasRole('ADMIN')">Usuarios</a>
        </nav>

        <!-- Controles de usuario y tema -->
        <div class="topbar-actions">
            <button type="button" id="theme-toggle" class="icon-btn theme-toggle" aria-label="Cambiar tema">
                <!-- Sol (visible en modo oscuro) -->
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                </svg>
                <!-- Luna (visible en modo claro) -->
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                </svg>
                <span class="theme-label">Tema</span>
            </button>

            <div class="user-pill">
                <span class="role-chip role-admin" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                <span class="role-chip role-mechanic" sec:authorize="hasRole('MECHANIC') and !hasRole('ADMIN')">MECÁNICO</span>
                <a class="user-email" th:href="@{/change-password}" title="Cambiar contraseña" sec:authentication="name"></a>
            </div>

            <!-- RF-02: cierre de sesión seguro (POST con token CSRF) -->
            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="btn btn-ghost btn-sm" title="Cerrar sesión">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span>Salir</span>
                </button>
            </form>
        </div>
    </div>
</header>
</body>
</html>
