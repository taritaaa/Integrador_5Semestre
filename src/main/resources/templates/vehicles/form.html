
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vehículo - Taller</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<h1 th:text="${vehicle.id() == null} ? 'Registrar vehículo' : 'Editar vehículo'">
    Registrar vehículo
</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}"></p>

<p th:if="${models.isEmpty()}">
    Primero debe registrar un modelo en
    <a th:href="@{/models}">Modelos</a>.
</p>

<form method="post"
      th:action="${vehicle.id() == null} ? @{/vehicles} : @{/vehicles/{id}(id=${vehicle.id()})}">

    <input type="hidden"
           name="_method"
           value="put"
           th:if="${vehicle.id() != null}">

    <!-- Modelo -->
    <label for="modelId">Modelo</label>

    <select id="modelId"
            name="modelId"
            required>

        <option value="">Seleccione</option>

        <option th:each="m : ${models}"
                th:value="${m.id()}"
                th:text="${m.name() + ' - ' + m.brand() + ' (' + m.vehicleTypeLabel() + ')'}"
                th:attr="data-example=${m.plateExample()},
                         data-format=${m.plateFormat()},
                         data-trailer=${m.trailerType()}"
                th:selected="${vehicle.modelId() == m.id()}">
        </option>

    </select>

    <!-- Tipo de servicio -->
    <label for="serviceType">Tipo de servicio</label>

    <select id="serviceType"
            name="serviceType"
            required>

        <option value="">Seleccione</option>

        <option th:each="s : ${serviceTypes}"
                th:value="${s}"
                th:text="${s.label()}"
                th:selected="${vehicle.serviceType() == s}">
        </option>

    </select>

    <!-- Placa: registrar -->
    <div th:if="${vehicle.id() == null}">

        <label for="licensePlate">Placa</label>

        <input type="text"
               id="licensePlate"
               name="licensePlate"
               maxlength="7"
               required
               placeholder="Seleccione primero el modelo"
               th:value="${vehicle.licensePlate()}">

    </div>

    <!-- Placa: editar -->
    <div th:if="${vehicle.id() != null}">

        <p>
            <strong>Placa:</strong>
            <span th:text="${vehicle.licensePlate()}"></span>
        </p>

        <input type="hidden"
               name="licensePlate"
               th:value="${vehicle.licensePlate()}">

    </div>

    <small id="plateHelp">
        Seleccione un modelo y un tipo de servicio
        para conocer el formato de placa.
    </small>

    <!-- Color de placa -->
    <label for="plateColor">Color de placa</label>

    <select id="plateColor"
            name="plateColor">

        <option value="">Automático</option>

        <option th:each="c : ${plateColors}"
                th:value="${c}"
                th:text="${c.label()}"
                th:selected="${vehicle.plateColor() == c}">
        </option>

    </select>

    <small id="plateColorHelp">
        El color se calcula automáticamente.
        En vehículos oficiales debe seleccionar un color.
    </small>

    <!-- Nombre del propietario -->
    <label for="ownerName">Nombre del propietario</label>

    <input type="text"
           id="ownerName"
           name="ownerName"
           maxlength="100"
           required
           th:value="${vehicle.ownerName()}">

    <!-- Documento del propietario -->
    <label for="ownerDocument">Documento del propietario</label>

    <input type="text"
           id="ownerDocument"
           name="ownerDocument"
           maxlength="20"
           required
           th:value="${vehicle.ownerDocument()}">

    <!-- Teléfono del propietario -->
    <label for="ownerPhone">Teléfono del propietario</label>

    <input type="text"
           id="ownerPhone"
           name="ownerPhone"
           maxlength="20"
           required
           th:value="${vehicle.ownerPhone()}">

    <!-- Botones -->
    <div>
        <button type="submit"
                th:disabled="${models.isEmpty()}">
            Guardar
        </button>

        <a th:href="@{/vehicles}">Cancelar</a>
    </div>

</form>

<!-- JavaScript separado del HTML -->
<script th:src="@{/js/vehicles.js}"></script>

</body>
</html>
