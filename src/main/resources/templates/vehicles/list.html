<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Flota de Vehículos')}"></head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/ui :: alerts}"></div>

<main class="app-main fade-in">

    <header class="page-header">
        <div>
            <h1 class="page-title">Vehículos Registrados</h1>
        </div>
        <div class="page-actions">
            <a th:href="@{/vehicles/model-by-plate}" class="btn btn-ghost">Consultar por Placa</a>
            <a th:href="@{/vehicles/new}" class="btn btn-accent">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span>Nuevo Vehículo</span>
            </a>
        </div>
    </header>

    <!-- Filtros exactos de VehicleController (?plate=...&owner=...) -->
    <form th:action="@{/vehicles}" method="get" class="filter-bar fade-in-1">
        <div class="form-group" style="flex: 1 1 210px;">
            <label for="filterPlate">Placa</label>
            <input type="search" id="filterPlate" name="plate" th:value="${plate}"
                   class="mono" style="text-transform: uppercase;" placeholder="Ej: ABC-123">
        </div>

        <div class="form-group" style="flex: 1 1 250px;">
            <label for="filterOwner">Propietario o Documento</label>
            <input type="search" id="filterOwner" name="owner" th:value="${owner}"
                   placeholder="Nombre o documento del propietario...">
        </div>

        <div style="display: flex; gap: 0.6rem; align-self: end;">
            <button type="submit" class="btn btn-primary">Filtrar</button>
            <a th:href="@{/vehicles}" class="btn btn-ghost">Limpiar</a>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(vehicles)}">
        <div th:replace="~{fragments/ui :: emptyState(
            'No se encontraron vehículos',
            'Registra un vehículo nuevo o ajusta los criterios de búsqueda.',
            @{/vehicles/new},
            '+ Registrar Vehículo'
        )}"></div>
    </div>

    <section th:if="${!#lists.isEmpty(vehicles)}" class="table-shell fade-in-2">
        <table class="neo-table">
            <thead>
            <tr>
                <th>Placa</th>
                <th>Modelo</th>
                <th>Servicio</th>
                <th>Propietario</th>
                <th>Documento</th>
                <th>Teléfono</th>
                <th class="col-actions">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${vehicles}">
                <td data-label="Placa">
                        <span class="plate-badge"
                              th:attr="data-plate-color=${v.plateColor() != null ? v.plateColor().name() : 'YELLOW'}"
                              th:text="${v.licensePlate()}">ABC-123</span>
                </td>
                <td data-label="Modelo">
                    <strong th:text="${v.modelBrand() + ' ' + v.modelName()}">Toyota Hilux</strong>
                </td>
                <td data-label="Servicio">
                    <span class="neo-badge badge-info" th:text="${v.serviceTypeLabel()}">Particular</span>
                </td>
                <td data-label="Propietario" th:text="${v.ownerName()}">Nombre Propietario</td>
                <td data-label="Documento">
                    <span class="mono" style="font-size: 0.84rem;" th:text="${v.ownerDocument()}">10203040</span>
                </td>
                <td data-label="Teléfono">
                    <span class="mono" style="font-size: 0.84rem;" th:text="${v.ownerPhone()}">3001234567</span>
                </td>
                <td data-label="Acciones" class="col-actions">
                    <div class="action-matrix">
                        <a th:href="@{/vehicles/{id}(id=${v.id()})}"
                           class="action-btn-view" data-tooltip="Ver detalle" aria-label="Ver detalle">
                            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </a>

                        <a th:href="@{/vehicles/{id}/edit(id=${v.id()})}"
                           class="action-btn-edit" data-tooltip="Editar registro" aria-label="Editar registro">
                            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </a>

                        <!-- Solo ADMIN puede eliminar vehículos (SecurityConfig) -->
                        <form sec:authorize="hasRole('ADMIN')"
                              th:action="@{/vehicles/{id}(id=${v.id()})}"
                              method="post"
                              data-no-guard="true"
                              onsubmit="return confirm('¿Eliminar este vehículo? Si posee reparaciones asociadas el sistema impedirá borrarlo.');">
                            <input type="hidden" name="_method" value="delete">
                            <button type="submit" class="action-btn-delete" data-tooltip="Eliminar registro" aria-label="Eliminar registro">
                                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

</main>

<footer th:replace="~{fragments/ui :: footer}"></footer>
</body>
</html>
