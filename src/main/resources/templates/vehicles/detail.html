<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Detalle del vehículo')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="page-shell">
    <div class="page-header">
        <div class="page-header-copy">
            <div class="breadcrumb">
                <a th:href="@{/}">Inicio</a>
                <span>/</span>
                <a th:href="@{/vehicles}">Vehículos</a>
                <span>/</span>
                <span th:text="${vehicle.licensePlate()}">Detalle</span>
            </div>
            <h1>Detalle del vehículo</h1>
            <p th:text="${vehicle.modelBrand() + ' ' + vehicle.modelName()}"></p>
        </div>

        <div class="page-actions">
            <a class="btn btn-secondary" th:href="@{/vehicles}">&larr; Volver al listado</a>
            <a class="btn" th:href="@{/vehicles/{id}/edit(id=${vehicle.id()})}">Editar vehículo</a>
        </div>
    </div>

    <div class="grid-2">
        <!-- Identificación del vehículo -->
        <section class="card">
            <div class="card-header">
                <h2>Identificación</h2>
                <span class="colombia-plate colombia-plate-lg"
                      th:attr="data-plate-color=${vehicle.plateColor()}"
                      th:text="${vehicle.licensePlate()}"></span>
            </div>

            <dl class="detail-grid">
                <div class="detail-item">
                    <dt>ID de registro</dt>
                    <dd class="mono" th:text="'#' + ${vehicle.id()}"></dd>
                </div>
                <div class="detail-item">
                    <dt>Color de placa</dt>
                    <dd th:text="${vehicle.plateColor()}"></dd>
                </div>
                <div class="detail-item">
                    <dt>Marca</dt>
                    <dd th:text="${vehicle.modelBrand()}"></dd>
                </div>
                <div class="detail-item">
                    <dt>Modelo</dt>
                    <dd th:text="${vehicle.modelName()}"></dd>
                </div>
            </dl>
        </section>

        <!-- Datos del propietario -->
        <section class="card">
            <div class="card-header">
                <h2>Propietario</h2>
                <span class="badge badge-info">Titular</span>
            </div>

            <dl class="detail-grid">
                <div class="detail-item">
                    <dt>Nombre completo</dt>
                    <dd th:text="${vehicle.ownerName()}"></dd>
                </div>
                <div class="detail-item">
                    <dt>Documento de identidad</dt>
                    <dd class="mono" th:text="${vehicle.ownerDocument()}"></dd>
                </div>
                <div class="detail-item">
                    <dt>Teléfono de contacto</dt>
                    <dd class="mono" th:text="${vehicle.ownerPhone()}"></dd>
                </div>
            </dl>
        </section>
    </div>
</main>
</body>
</html>
