spring.application.name=taller
server.port=8080

# ---------------- Base de datos H2 en memoria ----------------
spring.datasource.url=jdbc:h2:mem:tallerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 (solo la puede abrir un administrador con sesión iniciada)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Crea las tablas a partir de las entidades y muestra el SQL en consola
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------------- Formularios ----------------
# Permite que los formularios envíen PUT y DELETE (campo oculto _method)
spring.mvc.hiddenmethod.filter.enabled=true

# Los formularios (input type="date") envían fechas en formato ISO yyyy-MM-dd
spring.mvc.format.date=iso

# ---------------- Imágenes de repuestos (RF-20) ----------------
app.upload-dir=uploads/parts

# El límite real de 2 MB lo valida PartService para mostrar un mensaje claro
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------- Usuarios y contraseñas (RF-03, RF-04, RF-06) ----------------
# Dirección base de la aplicación, usada para armar el enlace de recuperación de contraseña
app.base-url=http://localhost:8080

# Minutos que dura el enlace de recuperación de contraseña
app.recovery-token-minutes=30

# Crea al iniciar los usuarios de prueba (admin y 2 mecánicos). Poner en false en producción.
app.seed-test-users=true

# ---------------- Correo con Gmail (RF-03) ----------------
# Las credenciales NO se escriben aquí: se leen de variables de entorno
#   MAIL_USERNAME = su correo de Gmail            (ej: micuenta@gmail.com)
#   MAIL_PASSWORD = contraseña de aplicación de 16 letras (NO la contraseña normal de Gmail)
# Si no están definidas, el correo falla y el enlace de recuperación queda escrito en la consola.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Remitente de los correos: la misma cuenta de Gmail
app.mail.from=${MAIL_USERNAME:no-reply@taller.local}