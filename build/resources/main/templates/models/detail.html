<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Detalle del modelo - Taller</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<h1>Detalle del modelo</h1>

<p><strong>ID:</strong> <span th:text="${vehicleModel.id()}"></span></p>
<p><strong>Nombre:</strong> <span th:text="${vehicleModel.name()}"></span></p>
<p><strong>Marca:</strong> <span th:text="${vehicleModel.brand()}"></span></p>
<p><strong>Tipo de vehículo:</strong> <span th:text="${vehicleModel.vehicleTypeLabel()}"></span></p>
<p><strong>Servicio:</strong> <span th:text="${vehicleModel.serviceTypeLabel()}"></span></p>
<p><strong>Formato de placa:</strong> <span th:text="${vehicleModel.plateFormat()}"></span></p>

<a sec:authorize="hasRole('ADMIN')" th:href="@{/models/{id}/edit(id=${vehicleModel.id()})}">Editar</a>
<a th:href="@{/models}">Volver al listado</a>
</body>
</html>
