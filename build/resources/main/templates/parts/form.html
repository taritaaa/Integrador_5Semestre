<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Repuesto - Taller</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>
<body>
<h1 th:text="${part.id() == null} ? 'Registrar repuesto' : 'Editar repuesto'"></h1>

<p th:if="${errorMessage}" th:text="${errorMessage}"></p>
<p th:if="${models.isEmpty()}">Primero debe registrar un modelo en <a th:href="@{/models/new}">Modelos</a>.</p>

<!-- Al registrar el formulario es multipart (puede traer imagen); al editar no -->
<form method="post"
      th:action="${part.id() == null} ? @{/parts} : @{/parts/{id}(id=${part.id()})}"
      th:attr="enctype=${part.id() == null} ? 'multipart/form-data' : 'application/x-www-form-urlencoded'">
    <input type="hidden" name="_method" value="put" th:if="${part.id() != null}">

    <label for="name">Nombre</label>
    <input type="text" id="name" name="name" maxlength="100" required th:value="${part.name()}">

    <label for="description">Descripción (opcional)</label>
    <input type="text" id="description" name="description" maxlength="255" th:value="${part.description()}">

    <label for="price">Precio</label>
    <input type="number" id="price" name="price" min="0" step="0.01" required th:value="${part.price()}">

    <label for="stock">Stock</label>
    <input type="number" id="stock" name="stock" min="0" step="1" required th:value="${part.stock()}">

    <!-- Al registrar, el EAN se escribe. Al editar, solo se muestra (no se puede cambiar). -->
    <div th:if="${part.id() == null}">
        <label for="ean">Código de barras (EAN, 13 dígitos)</label>
        <input type="text" id="ean" name="ean" maxlength="13" pattern="\d{13}" required
               th:value="${part.ean()}">
    </div>
    <div th:if="${part.id() != null}">
        <p><strong>Código de barras:</strong> <span th:text="${part.ean()}"></span></p>
        <input type="hidden" name="ean" th:value="${part.ean()}">
    </div>

    <label for="modelId">Modelo compatible</label>
    <select id="modelId" name="modelId" required>
        <option value="">Seleccione</option>
        <option th:each="m : ${models}" th:value="${m.id()}" th:text="${m.name() + ' - ' + m.brand()}"
                th:selected="${part.modelId() == m.id()}"></option>
    </select>

    <!-- La imagen solo se adjunta al registrar; para cambiarla después se usa la pantalla de detalle -->
    <div th:if="${part.id() == null}">
        <label for="image">Imagen de referencia (opcional, JPG, PNG o WEBP, máximo 2 MB)</label>
        <input type="file" id="image" name="image" accept="image/png,image/jpeg,image/webp">
    </div>

    <button type="submit">Guardar</button>
    <a th:href="@{/parts}">Cancelar</a>
</form>
</body>
</html>
