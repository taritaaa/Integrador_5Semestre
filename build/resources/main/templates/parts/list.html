
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Repuestos - Taller</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>

<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<h1>Repuestos</h1>

<!-- Notificaciones -->
<p th:if="${successMessage}"
   th:text="${successMessage}"></p>

<p th:if="${errorMessage}"
   th:text="${errorMessage}"></p>

<!-- Registrar: solo administrador -->
<a sec:authorize="hasRole('ADMIN')"
   th:href="@{/parts/new}">
    Registrar repuesto
</a>

<!-- Búsqueda por modelo -->
<a th:href="@{/parts/compatible}">
    Buscar repuestos compatibles
</a>

<a th:href="@{/models}">
    Consultar modelos
</a>

<!-- Sin repuestos -->
<p th:if="${#lists.isEmpty(parts)}">
    No hay repuestos registrados.
</p>

<!-- Listado -->
<table th:unless="${#lists.isEmpty(parts)}">

    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Código de barras</th>
        <th>Modelo compatible</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Acciones</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="p : ${parts}">

        <td th:text="${p.id()}"></td>

        <td th:text="${p.name()}"></td>

        <td th:text="${p.ean()}"></td>

        <td th:text="${p.modelName() + ' - ' + p.modelBrand()}"></td>

        <td th:text="${'$ ' + #numbers.formatDecimal(p.price(), 1, 'POINT', 2, 'COMMA')}"></td>

        <td>
            <strong th:if="${p.stock() == 0}">
                Agotado
            </strong>

            <span th:if="${p.stock() > 0}"
                  th:text="${p.stock()}"></span>
        </td>

        <td>

            <!-- Consultar: ambos roles -->
            <a th:href="@{/parts/{id}(id=${p.id()})}">
                Ver
            </a>

            <!-- Editar: administrador -->
            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/parts/{id}/edit(id=${p.id()})}">
                Editar
            </a>

            <!-- Eliminar: administrador -->
            <form sec:authorize="hasRole('ADMIN')"
                  th:action="@{/parts/{id}(id=${p.id()})}"
                  method="post">

                <input type="hidden"
                       name="_method"
                       value="delete">

                <button type="submit">
                    Eliminar
                </button>

            </form>

        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
