<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del usuario - Taller</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<h1>Detalle del usuario</h1>

<p><strong>ID:</strong> <span th:text="${user.id()}"></span></p>
<p><strong>Nombre:</strong> <span th:text="${user.name()}"></span></p>
<p><strong>Documento:</strong> <span th:text="${user.document()}"></span></p>
<p><strong>Correo:</strong> <span th:text="${user.email()}"></span></p>
<p><strong>Teléfono:</strong> <span th:text="${user.phone()}"></span></p>
<p><strong>Rol:</strong> <span th:text="${user.role()}"></span></p>
<p><strong>Estado:</strong> <span th:text="${user.active()} ? 'Activa' : 'Desactivada'"></span></p>

<a th:href="@{/users/{id}/edit(id=${user.id()})}">Editar</a>
<a th:href="@{/users}">Volver al listado</a>
</body>
</html>
