<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuario - Taller</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<h1 th:text="${user.id() == null} ? 'Registrar usuario' : 'Editar usuario'"></h1>

<p th:if="${errorMessage}" th:text="${errorMessage}"></p>

<form method="post"
      th:action="${user.id() == null} ? @{/users} : @{/users/{id}(id=${user.id()})}">
    <input type="hidden" name="_method" value="put" th:if="${user.id() != null}">

    <label for="name">Nombre</label>
    <input type="text" id="name" name="name" maxlength="100" required th:value="${user.name()}">

    <!-- Al registrar se escriben documento y correo (la contraseña se genera sola).
         Al editar, documento y correo solo se muestran. -->
    <div th:if="${user.id() == null}">
        <label for="document">Documento</label>
        <input type="text" id="document" name="document" maxlength="20" required th:value="${user.document()}">

        <label for="email">Correo</label>
        <input type="email" id="email" name="email" maxlength="100" required th:value="${user.email()}">

        <p><small>La contraseña se genera automáticamente y se le mostrará al terminar el registro.
            El usuario deberá cambiarla en su primer inicio de sesión.</small></p>
    </div>
    <div th:if="${user.id() != null}">
        <p><strong>Documento:</strong> <span th:text="${user.document()}"></span></p>
        <p><strong>Correo:</strong> <span th:text="${user.email()}"></span></p>
    </div>

    <label for="phoneCountry">País e indicativo del celular</label>
    <select id="phoneCountry" class="phone-country" required>
        <option value="+57">Colombia (+57)</option>
        <option value="+52">México (+52)</option>
        <option value="+1">Estados Unidos / Canadá (+1)</option>
        <option value="+34">España (+34)</option>
        <option value="+56">Chile (+56)</option>
        <option value="+51">Perú (+51)</option>
    </select>
    <label for="phoneLocal">Número de celular</label>
    <input id="phoneLocal" class="phone-local" type="tel" inputmode="numeric" required
           placeholder="3001234567" pattern="[0-9]+">
    <input type="hidden" id="phone" name="phone" th:value="${user.phone()}">
    <small>Se guardará el número completo con indicativo, por ejemplo +573001234567.</small>

    <label for="role">Rol</label>
    <select id="role" name="role" required>
        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                th:selected="${user.role() == r}"></option>
    </select>

    <!-- Desactivar una cuenta es poner el estado en "Desactivada" -->
    <div th:if="${user.id() != null}">
        <label for="active">Estado de la cuenta</label>
        <select id="active" name="active" required>
            <option value="true" th:selected="${user.active()}">Activa</option>
            <option value="false" th:selected="${!user.active()}">Desactivada</option>
        </select>
    </div>

    <button type="submit">Guardar</button>
    <a th:href="@{/users}">Cancelar</a>
</form>
<script th:src="@{/js/phone-validation.js}"></script>
</body>
</html>
