<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Taller</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<h1>Usuarios</h1>

<p th:if="${successMessage}" th:text="${successMessage}"></p>
<p th:if="${errorMessage}" th:text="${errorMessage}"></p>

<a th:href="@{/users/new}">Registrar usuario</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}">
        <td th:text="${u.id()}"></td>
        <td th:text="${u.name()}"></td>
        <td th:text="${u.email()}"></td>
        <td th:text="${u.role()}"></td>
        <td th:text="${u.active()} ? 'Activa' : 'Desactivada'"></td>
        <td>
            <a th:href="@{/users/{id}(id=${u.id()})}">Ver</a>
            <a th:href="@{/users/{id}/edit(id=${u.id()})}">Editar</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
