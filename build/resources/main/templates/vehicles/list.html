
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Vehículos - Taller</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>

<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<h1>Vehículos</h1>

<!-- Mensajes -->
<p th:if="${successMessage}"
   th:text="${successMessage}"></p>

<p th:if="${errorMessage}"
   th:text="${errorMessage}"></p>

<!-- Opciones -->
<a th:href="@{/vehicles/new}">
    Registrar vehículo
</a>

<a th:href="@{/vehicles/model-by-plate}">
    Buscar modelo por placa
</a>

<a th:href="@{/models}">
    Modelos
</a>

<!-- Filtros de búsqueda -->
<h2>Buscar vehículos</h2>

<form method="get" th:action="@{/vehicles}">

    <label for="plate">Placa</label>

    <input type="text"
           id="plate"
           name="plate"
           placeholder="Ej: ABC-123"
           th:value="${plate}">

    <label for="owner">Propietario</label>

    <input type="text"
           id="owner"
           name="owner"
           th:value="${owner}">

    <button type="submit">
        Buscar
    </button>

    <a th:href="@{/vehicles}">
        Limpiar
    </a>

</form>

<!-- Sin resultados -->
<p th:if="${#lists.isEmpty(vehicles)}">
    No se encontraron vehículos.
</p>

<!-- Lista de vehículos -->
<table th:unless="${#lists.isEmpty(vehicles)}">

    <thead>

    <tr>
        <th>ID</th>
        <th>Placa</th>
        <th>Color de placa</th>
        <th>Tipo de servicio</th>
        <th>Propietario</th>
        <th>Modelo</th>
        <th>Acciones</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="v : ${vehicles}">

        <td th:text="${v.id()}"></td>

        <td th:text="${v.licensePlate()}"></td>

        <td th:text="${v.plateColorLabel()}"></td>

        <td th:text="${v.serviceTypeLabel()}"></td>

        <td th:text="${v.ownerName()}"></td>

        <td th:text="${v.modelName() + ' - ' + v.modelBrand()}"></td>

        <td>

            <!-- Ver detalle -->
            <a th:href="@{/vehicles/{id}(id=${v.id()})}">
                Ver
            </a>

            <!-- Administrador y mecánico -->
            <a th:href="@{/vehicles/{id}/edit(id=${v.id()})}">
                Editar
            </a>

            <!-- Eliminar: solo administrador -->
            <form sec:authorize="hasRole('ADMIN')"
                  th:action="@{/vehicles/{id}(id=${v.id()})}"
                  method="post">

                <input type="hidden"
                       name="_method"
                       value="delete">

                <button type="submit">
                    Eliminar
                </button>

            </form>

        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
