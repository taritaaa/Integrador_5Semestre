<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ubicación de Reparación #' + ${repair.id()})}"></head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/ui :: alerts}"></div>

<main class="app-main fade-in">

    <nav class="breadcrumb-trail" aria-label="Ruta de navegación">
        <a th:href="@{/}">Panel</a>
        <span class="breadcrumb-sep">//</span>
        <a th:href="@{/repairs}">Reparaciones</a>
        <span class="breadcrumb-sep">//</span>
        <a th:href="@{/repairs/{id}(id=${repair.id()})}" th:text="'Orden #' + ${repair.id()}">Orden</a>
        <span class="breadcrumb-sep">//</span>
        <span>Ubicación GPS</span>
    </nav>

    <header class="page-header">
        <div>
            <div class="page-eyebrow">Geolocalización // RF-28</div>
            <h1 class="page-title" th:text="${'Ubicación — Orden #' + repair.id()}">Ubicación GPS</h1>
            <p class="page-subtitle">
                Vehículo <strong class="mono" th:text="${repair.licensePlate()}">ABC-123</strong>.
                Haz clic sobre el mapa o usa el GPS del dispositivo para fijar el taller o tienda de repuestos.
            </p>
        </div>
        <div class="page-actions">
            <a th:href="@{/repairs/{id}(id=${repair.id()})}" class="btn btn-ghost">← Volver a la Orden</a>
        </div>
    </header>

    <section class="form-shell fade-in-1">
        <form th:action="@{/repairs/{id}/location(id=${repair.id()})}" method="post">
            <input type="hidden" name="_method" value="put">

            <div class="form-grid" style="margin-bottom: 1.25rem;">
                <div class="form-group full-width">
                    <label for="workshopName">Nombre del Taller o Tienda de Repuestos *</label>
                    <input type="text" id="workshopName" name="workshopName"
                           th:value="${repair.workshopName()}"
                           placeholder="Ej: Veloxa Service Sede Principal / Repuestos El Motor"
                           required autofocus>
                </div>

                <!-- IDs para repair-location.js; names para RepairController.saveLocation -->
                <div class="form-group">
                    <label for="workshopLatitude">Latitud *</label>
                    <input type="number" id="workshopLatitude" name="latitude"
                           th:value="${repair.workshopLatitude()}"
                           step="any" class="mono" placeholder="5.535280" required>
                </div>

                <div class="form-group">
                    <label for="workshopLongitude">Longitud *</label>
                    <input type="number" id="workshopLongitude" name="longitude"
                           th:value="${repair.workshopLongitude()}"
                           step="any" class="mono" placeholder="-73.367780" required>
                </div>
            </div>

            <div class="map-toolbar">
                <span class="form-hint">Arrastra el pin en el mapa para ajustar la precisión al metro.</span>
                <button type="button" id="currentLocation" class="btn btn-primary" style="min-height: 40px;">
                    Capturar Ubicación Actual (GPS)
                </button>
            </div>

            <div class="neo-map-frame">
                <div id="repairLocationMap" class="neo-map-canvas tall"></div>
            </div>
            <p id="locationMessage" class="location-status-msg"></p>

            <div class="form-actions">
                <a th:href="@{/repairs/{id}(id=${repair.id()})}" class="btn btn-ghost">Cancelar</a>
                <button type="submit" class="btn btn-accent">Guardar Ubicación →</button>
            </div>
        </form>
    </section>

</main>

<footer th:replace="~{fragments/ui :: footer}"></footer>
<script th:src="@{/js/repair-location.js}" defer></script>
</body>
</html>
