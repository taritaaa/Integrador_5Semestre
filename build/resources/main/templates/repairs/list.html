<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>Historial de reparaciones</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1>Historial de reparaciones</h1>
<p th:if="${successMessage}" th:text="${successMessage}"></p>
<p th:if="${errorMessage}" th:text="${errorMessage}"></p>
<p><a th:href="@{/repairs/new}">Registrar reparación</a> |
<a th:href="@{/repairs/map}">Mapa de talleres</a></p>
<form method="get" th:action="@{/repairs}">
    <label for="plate">Placa</label><input id="plate" name="plate" th:value="${plate}">
    <label for="status">Estado</label>
    <select id="status" name="status">
        <option value="">Todos</option>
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                th:selected="${selectedStatus == s}"></option>
    </select>
    <button type="submit">Filtrar</button><a th:href="@{/repairs}">Limpiar</a>
</form>
<p th:if="${repairs.isEmpty()}">No hay reparaciones para mostrar.</p>
<table th:unless="${repairs.isEmpty()}">
    <thead><tr><th>ID</th><th>Fecha</th><th>Placa</th><th>Tipo</th><th>Estado</th>
        <th>Mecánico</th><th>Costo total</th><th>Acciones</th></tr></thead>
    <tbody><tr th:each="r : ${repairs}">
        <td th:text="${r.id()}"></td><td th:text="${r.date()}"></td>
        <td th:text="${r.licensePlate()}"></td><td th:text="${r.type()}"></td>
        <td th:text="${r.status()}"></td><td th:text="${r.mechanicName()}"></td>
        <td th:text="${r.totalCost()}"></td>
        <td><a th:href="@{/repairs/{id}(id=${r.id()})}">Ver</a>
            <a th:href="@{/repairs/{id}/edit(id=${r.id()})}">Editar</a>
            <a th:href="@{/repairs/map(plate=${r.licensePlate()})}">Mapa de placa</a>
            <form sec:authorize="hasRole('ADMIN')" method="post"
                  th:action="@{/repairs/{id}(id=${r.id()})}">
                <input type="hidden" name="_method" value="delete">
                <button type="submit">Eliminar</button>
            </form>
        </td>
    </tr></tbody>
</table>
</body>
</html>
