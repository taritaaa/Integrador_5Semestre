<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña - Taller</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>
<body>
<h1>Recuperar contraseña</h1>

<p>Ingrese su correo y le enviaremos un enlace temporal para restablecer su contraseña.</p>

<p th:if="${infoMessage}" th:text="${infoMessage}"></p>
<p th:if="${errorMessage}" th:text="${errorMessage}"></p>

<form method="post" th:action="@{/forgot-password}">
    <label for="email">Correo</label>
    <input type="email" id="email" name="email" required>
    <button type="submit">Enviar enlace</button>
</form>

<p><a th:href="@{/login}">Volver al inicio de sesión</a></p>
</body>
</html>
