<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cambiar Contraseña')}"></head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/ui :: alerts}"></div>

<main class="auth-centered-stage fade-in">
    <section class="auth-card auth-centered-card" aria-label="Cambio de contraseña">
        <div class="auth-card-head">
            <div class="auth-card-eyebrow">Veloxa Service • Seguridad</div>
            <h1 class="auth-card-title">Cambiar Contraseña</h1>
            <p class="auth-card-subtitle">
                Actualiza tu clave actual o reemplaza la contraseña temporal asignada por el administrador.
            </p>
        </div>

        <div th:if="${errorMessage}" class="auth-inline-alert error" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="auth-inline-alert success" role="status">
            <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/change-password}" method="post" class="auth-form">
            <div class="form-group">
                <label for="currentPassword">Contraseña Actual</label>
                <input type="password"
                       id="currentPassword"
                       name="currentPassword"
                       placeholder="••••••••••••"
                       autocomplete="current-password"
                       required
                       autofocus>
            </div>

            <div class="form-group">
                <label for="newPassword">Nueva Contraseña</label>
                <input type="password"
                       id="newPassword"
                       name="newPassword"
                       data-password-strength="true"
                       placeholder="••••••••••••"
                       autocomplete="new-password"
                       required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Nueva Contraseña</label>
                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="••••••••••••"
                       autocomplete="new-password"
                       required>
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem;">
                <a th:href="@{/}" class="btn btn-ghost" style="flex: 1;">Cancelar</a>
                <button type="submit" class="btn btn-accent" style="flex: 1.4;">Actualizar Clave →</button>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/ui :: footer}"></footer>
<script th:src="@{/js/password-strength.js}" defer></script>

</body>
</html>
