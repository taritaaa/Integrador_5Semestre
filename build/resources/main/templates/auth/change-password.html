<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña - Taller</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>
<body>
<div th:replace="~{fragments/ui :: ui}"></div>

<h1>Cambiar contraseña</h1>
<p>Por seguridad, debe cambiar su contraseña temporal antes de continuar.</p>

<p th:if="${errorMessage}" th:text="${errorMessage}"></p>

<form method="post" th:action="@{/change-password}">
    <label for="currentPassword">Contraseña actual (la temporal)</label>
    <input type="password" id="currentPassword" name="currentPassword" required autofocus>

    <label for="newPassword">Nueva contraseña</label>
    <input type="password" id="newPassword" name="newPassword" maxlength="72" required>
    <!-- Indicador de seguridad: lo llena password-strength.js -->
    <div id="pw-strength" aria-live="polite"></div>

    <label for="confirmPassword">Confirmar nueva contraseña</label>
    <input type="password" id="confirmPassword" name="confirmPassword" maxlength="72" required>

    <button type="submit">Guardar contraseña</button>
</form>

<!-- RF-02: el usuario siempre puede cerrar sesión -->
<form th:action="@{/logout}" method="post">
    <button type="submit">Cerrar sesión</button>
</form>

<script th:src="@{/js/password-strength.js}"></script>
</body>
</html>
